<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amrita Admissions | Amrita Vishwa Vidyapeetham – Coimbatore</title>
    <meta name="description"
        content="Apply for admission at Amrita Vishwa Vidyapeetham, Coimbatore. Explore B.Tech, MBA, MBBS programs, fees, scholarships, and get instant answers from our AI-powered chatbot.">
    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="bg-gray-50">
    <div id="app">
        <header id="header"></header>
        <main id="main-content" class="min-h-screen"></main>
        <footer id="footer"></footer>
    </div>

    <!-- Chatbot Modal -->
    <div id="chatbot-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-end sm:items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col" style="max-height: 85vh;">
                <div class="flex items-center justify-between p-4 border-b">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-9 h-9 rounded-xl bg-gradient-to-br from-crimson-600 to-crimson-800 flex items-center justify-center text-white text-sm font-bold">
                            🎓</div>
                        <div>
                            <h3 class="text-sm font-bold text-gray-900" style="font-family: 'Playfair Display', serif;">Amrita AI Assistant</h3>
                            <span class="text-xs text-green-500 font-medium">● Online</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="chat-clear-btn" title="Clear chat"
                            class="text-gray-400 hover:text-red-400 text-sm transition px-2 py-1 rounded-lg hover:bg-gray-100">🗑 Clear</button>
                        <button onclick="toggleChatbot()" title="Close"
                            class="text-gray-400 hover:text-gray-600 text-xl leading-none transition">✕</button>
                    </div>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-1"></div>
                <!-- Suggestions chip bar -->
                <div id="chat-suggestions" class="suggestions-bar"></div>
                <div class="p-4 border-t">
                    <div class="flex space-x-2">
                        <input type="text" id="chat-input"
                            class="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-crimson-500 focus:border-transparent placeholder-gray-400"
                            placeholder="Ask about admissions, fees, AEEE...">
                        <button id="send-button"
                            class="px-4 py-2.5 bg-crimson-600 text-white rounded-xl hover:bg-crimson-700 focus:outline-none focus:ring-2 focus:ring-crimson-500 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load api.js before app.js and chatbot.js since they depend on it -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>
</body>

</html>
